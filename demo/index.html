<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box3D for Rust — Interactive Physics Demos</title>
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/shell.css">
</head>
<body>
  <!-- Menu bar (Sim / View / Render / Samples / Help) — filled by main.ts,
       mirrors the C samples app's DrawMenuBar. -->
  <div id="menubar" class="menubar"></div>

  <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <nav id="sidebar">
    <div class="sidebar-header">
      <a href="#/" class="logo-link">
        <h1 class="logo">Box3D<span class="logo-accent">.rs</span></h1>
      </a>
      <p class="tagline">Erin Catto's Samples · Rust port</p>
    </div>
    <!-- Category→sample tree, filled by main.ts from the registry. -->
    <div id="sample-tree" class="sample-tree"></div>
    <div class="sidebar-footer">
      <p><a href="https://github.com/larsbrubaker/box3d-rust" target="_blank">Source on GitHub</a></p>
      <p>Rust port of <a href="https://github.com/erincatto/box3d" target="_blank">Box3D</a></p>
      <p><a href="https://larsbrubaker.github.io/box2d-rust/" target="_blank">box2d-rust demos</a></p>
      <p class="license">MIT License</p>
      <!-- Build version + git hash, injected by main.ts from src/version.ts. -->
      <p class="build-info" id="build-info"></p>
    </div>
  </nav>

  <main id="main-content">
    <!-- Content dynamically injected by router -->
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
