[package]
name = "box3d-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the Box3D Rust physics engine demos"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
box3d-rust = { path = "../.." }
wasm-bindgen = "0.2"

# Re-enabled after b82cebcc set `wasm-opt = false` with no rationale (Continuous
# commit). Binaryen `wasm-opt` is not on every Windows PATH; `build-wasm.ps1`
# falls back to `--no-opt` when missing. CI (ubuntu) runs wasm-opt normally.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[lints]
workspace = true
